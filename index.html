<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Salud/favicon.svg" />
    <!-- v4.0: pinch-zoom is allowed again (WCAG 1.4.4 Resize Text). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090E0C" media="(prefers-color-scheme: dark)" />
    <title>Salud｜給每個人的健康學習平台</title>
    <meta name="description" content="健康，從好奇開始。Salud 用免費白話小課、人體圖解與研究來源，陪你認識飲食、運動、睡眠、健檢與疾病照護。依自己的步調，從生活問題讀進醫學知識。" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_TW" />
    <meta property="og:title" content="Salud｜健康，從好奇開始" />
    <meta property="og:description" content="從白話重點、圖解，到研究來源。免費學習飲食、運動、睡眠與健康知識，照自己的步調就好。" />
    <meta property="og:url" content="https://waatax.github.io/Salud/" />
    <link rel="canonical" href="https://waatax.github.io/Salud/" />
    <link rel="manifest" href="/Salud/manifest.webmanifest" />
    <meta name="twitter:card" content="summary" />
    <meta property="og:site_name" content="Salud" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Salud",
        "alternateName": "Salud 健康學習平台",
        "url": "https://waatax.github.io/Salud/",
        "inLanguage": "zh-TW",
        "description": "免費的健康教育網站：白話小課、人體圖解與研究來源，涵蓋飲食、運動、睡眠、健檢與疾病照護。內容為衛教資訊，不取代醫療專業評估。",
        "isAccessibleForFree": true,
        "audience": { "@type": "Audience", "audienceType": "一般大眾" }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
      // Resolve the theme before first paint: an explicit choice wins, otherwise follow the OS.
      // v5.0 themes: light (森林綠) · dark · ocean (藍青) · earth (棕色) · blossom (粉色).
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('salud-theme-choice'); } catch (e) {}
        var themes = ['light', 'dark', 'ocean', 'earth', 'blossom'];
        if (themes.indexOf(saved) < 0) saved = null;
        var dark = saved ? saved === 'dark' : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var root = document.documentElement;
        root.classList.add(dark ? 'dark' : 'light');
        if (saved && saved !== 'light' && saved !== 'dark') root.setAttribute('data-theme', saved);
      })();
    </script>
  </head>
  <body class="bg-salud-light-bg text-salud-light-text dark:bg-salud-dark-bg dark:text-salud-dark-text antialiased selection:bg-emerald-500/25 transition-colors duration-200">
    <noscript>Salud 需要啟用 JavaScript 才能使用。</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
